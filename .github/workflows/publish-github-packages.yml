name: Publish PDF Viewer to GitHub Packages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-github-packages.yml"
    tags:
      - "pdfview-v*"
  workflow_dispatch:
    inputs:
      version:
        description: Maven version to publish (for example 3.2.20-search.1)
        required: true
        type: string

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK platform
        run: |
          sdkmanager --channel=1 "platforms;android-37.0"
          ln -s "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"

      - name: Determine Maven version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            VERSION="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#pdfview-v}"
          else
            VERSION="3.2.20-search.1"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release library
        run: ./gradlew :android-pdf-viewer:assembleRelease

      - name: Publish fork artifact
        run: ./gradlew :android-pdf-viewer:publishGithubPackagesPublicationToGitHubPackagesRepository -PgithubPackagesVersion="${{ steps.version.outputs.value }}"
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
